# Builds a debug APK on GitHub-hosted runners so a local Android SDK is not required.
# Models are not part of CI; they are pushed to a device with adb (see README).
name: Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Keep in sync with build.gradle.kts (ndkVersion, cmake.version, compileSdk).
    env:
      NDK_VERSION: "30.0.14904198"
      CMAKE_VERSION: "3.22.1"
      ANDROID_COMPILE_SDK: "36"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install platform, NDK, and CMake
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -d "${ANDROID_HOME}/cmake/${CMAKE_VERSION}"

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK and native libraries
        run: |
          APK="build/outputs/apk/debug/MedGemma-debug.apk"
          if [[ ! -f "${APK}" ]]; then
            echo "Expected APK not found at ${APK}"
            find build/outputs -name '*.apk' -print || true
            exit 1
          fi
          echo "APK: ${APK} ($(du -h "${APK}" | cut -f1))"
          unzip -l "${APK}" | grep '\.so$' || {
            echo "No native .so libraries in APK; CMake/NDK build did not package JNI"
            exit 1
          }
          unzip -l "${APK}" | grep -q 'lib/arm64-v8a/libmedgemma-native.so' || {
            echo "Missing lib/arm64-v8a/libmedgemma-native.so"
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedGemma-debug
          path: build/outputs/apk/debug/MedGemma-debug.apk
          if-no-files-found: error
          retention-days: 14

      # One rolling pre-release so phones can download without the Actions UI.
      # Same-repo runs only; fork PRs do not get a writable GITHUB_TOKEN.
      - name: Publish debug-latest pre-release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK="build/outputs/apk/debug/MedGemma-debug.apk"
          NOTES="$(printf '%s\n\n%s\n\n%s\n' \
            "Debug APK from \`${RELEASE_TARGET}\`." \
            "Models are not included. Push GGUFs to the device with adb (see README)." \
            "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          gh release delete debug-latest --yes || true
          git push origin :refs/tags/debug-latest || true
          gh release create debug-latest \
            "${APK}" \
            --title "Debug APK (latest)" \
            --notes "${NOTES}" \
            --prerelease \
            --latest=false \
            --target "${RELEASE_TARGET}"
